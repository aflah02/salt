name: ParT

# Particle Transformer (ParT, CMS, arXiv:2202.03772) expressed with Salt primitives.
# ParT = pairwise interaction bias (P-MHA) added to the pre-softmax attention logits
# (EdgeAttention) + standard multi-head attention + standard 2-layer FFN + a class-attention
# pooling head. No talking-heads, no LayerScale, no stochastic depth, no post-softmax gate.
# DeParT.yaml extends this baseline with the four DeParT tricks.
# Data/tasks follow the GN3 dataset (see GN3v01/GN3V00.yaml); edges use the track-pair
# features computable from that dump (dR/kt/z from pt + jet-relative deta/dphi).

model:
  model:
    class_path: salt.models.SaltModel
    init_args:
      init_nets:
        - input_name: tracks
          dense_config:
            output_size: &embed_dim 128
            hidden_layers: [256]
            activation: &activation GELU

      edge_init_nets:
        - input_name: tracks
          dense_config:
            output_size: &edge_embed_dim 32
            hidden_layers: [32]
            activation: *activation

      encoder:
        class_path: salt.models.Transformer
        init_args:
          num_layers: 8
          embed_dim: *embed_dim
          edge_embed_dim: *edge_embed_dim
          update_edges: true
          out_dim: &out_dim 128
          norm: LayerNorm
          # keep one register as a NaN-guard for empty jets but drop it before pooling
          # (faithful ParT: the class-attention head sees only real constituents)
          drop_registers: true
          # standard 2-layer FFN (no gating)
          dense_kwargs:
            activation: *activation
            gated: false
          # faithful ParT self-attention: interaction bias only, no talking-heads, no gate
          attn_kwargs:
            num_heads: 8
            talking_heads: false
            edge_gate: false

      # class-attention pooling head: a learned class token cross-attends to the constituents
      pool_net:
        class_path: salt.models.ClassAttentionPooling
        init_args:
          input_size: *out_dim
          num_layers: 2
          ls_init: null  # faithful ParT: no LayerScale (added only in DeParT)
          dense_kwargs:
            activation: *activation
            gated: false
          attn_kwargs:
            num_heads: 8

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: salt.models.ClassificationTask
              init_args:
                name: jets_classification
                input_name: jets
                label: flavour_label
                use_class_dict: True
                loss:
                  class_path: torch.nn.CrossEntropyLoss
                dense_config:
                  input_size: *out_dim
                  output_size: 6
                  hidden_layers: [128, 64, 32]
                  activation: *activation

            - class_path: salt.models.ClassificationTask
              init_args:
                name: track_origin
                input_name: tracks
                label: ftagTruthOriginLabel
                use_class_dict: True
                weight: 0.5
                loss:
                  class_path: torch.nn.CrossEntropyLoss
                dense_config:
                  input_size: *out_dim
                  context_size: *out_dim
                  output_size: 8
                  hidden_layers: [128, 64, 32]
                  activation: *activation

            - class_path: salt.models.VertexingTask
              init_args:
                name: track_vertexing
                input_name: tracks
                label: ftagTruthVertexIndex
                weight: 1.5
                loss:
                  class_path: torch.nn.BCEWithLogitsLoss
                  init_args:
                    reduction: none
                dense_config:
                  input_size: 256  # 2 * out_dim (pair of track embeddings)
                  context_size: *out_dim
                  hidden_layers: [128, 64, 32]
                  output_size: 1
                  activation: *activation

data:
  input_map:
    jets: jets
    tracks: tracks_ghost
  selections: null
  non_finite_to_num: True
  variables:
    jets:
      - pt_btagJes
      - eta_btagJes
    tracks:
      - pt  # needed for the kt/z edge features
      - d0
      - z0SinTheta
      - dphi
      - deta
      - qOverP
      - lifetimeSignedD0Significance
      - lifetimeSignedZ0SinThetaSignificance
      - phiUncertainty
      - thetaUncertainty
      - qOverPUncertainty
      - numberOfPixelHits
      - numberOfSCTHits
      - numberOfInnermostPixelLayerHits
      - numberOfNextToInnermostPixelLayerHits
      - numberOfInnermostPixelLayerSharedHits
      - numberOfInnermostPixelLayerSplitHits
      - numberOfPixelSharedHits
      - numberOfPixelSplitHits
      - numberOfSCTSharedHits
      - leptonID
      - muon_quality
      - muon_qOverPratio
      - muon_momentumBalanceSignificance
      - muon_scatteringNeighbourSignificance
  edge_constructors:
    - input_name: tracks
      edge_features:
        - dR
        - kt
        - z
        - isSelfLoop
  train_file: /global/cfs/cdirs/atlas/jmw464/gn3_data/pp_output_train.h5
  val_file: /global/cfs/cdirs/atlas/jmw464/gn3_data/pp_output_val.h5
  norm_dict: /global/cfs/cdirs/atlas/jmw464/gn3_data/GN3V01-Training-Samples/norm_dict.yaml
  class_dict: /global/cfs/cdirs/atlas/jmw464/gn3_data/GN3V01-Training-Samples/class_dict.yaml
  batch_size: 1000
  num_workers: 20

trainer:
  max_epochs: 40
  accelerator: gpu
  devices: 4
  num_nodes: 4
  precision: bf16-mixed
