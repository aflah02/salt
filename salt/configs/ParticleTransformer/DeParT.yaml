name: DeParT

# Dynamically Enhanced Particle Transformer (DeParT; Prague thesis S. Jankových 2023,
# ATLAS q/g tagging ATL-PHYS-PUB-2023-032), expressed with Salt primitives.
# DeParT = ParT (see ParT.yaml) + four tricks, all toggled from the encoder block below:
#   1. talking-heads attention   (attn_kwargs.talking_heads: true)
#   2. gated GLU FFN             (dense_kwargs.gated: true)
#   3. LayerScale                (ls_init)
#   4. stochastic depth          (drop_path + linear schedule)
# embed/layer/head dims below are Salt-tuned and free to change.
# Data/tasks follow the GN3 dataset (see GN3v01/GN3V00.yaml); edges use the track-pair
# features computable from that dump (dR/kt/z from pt + jet-relative deta/dphi).

model:
  model:
    class_path: salt.models.SaltModel
    init_args:
      init_nets:
        - input_name: tracks
          dense_config:
            output_size: &embed_dim 128
            hidden_layers: [256]
            activation: &activation GELU

      edge_init_nets:
        - input_name: tracks
          dense_config:
            output_size: &edge_embed_dim 32
            hidden_layers: [32]
            activation: *activation

      encoder:
        class_path: salt.models.Transformer
        init_args:
          num_layers: 8
          embed_dim: *embed_dim
          edge_embed_dim: *edge_embed_dim
          update_edges: true
          out_dim: &out_dim 128
          norm: LayerNorm
          # keep one register as a NaN-guard for empty jets but drop it before pooling
          # (faithful ParT: the class-attention head sees only real constituents)
          drop_registers: true
          # DeParT trick 3+4: LayerScale + stochastic depth with a linear per-layer ramp
          ls_init: 1.0e-5
          drop_path: 0.1
          drop_path_schedule: linear
          # DeParT trick 2: gated GLU FFN
          dense_kwargs:
            activation: *activation
            gated: true
          # DeParT trick 1: talking-heads on top of the ParT interaction bias (no gate)
          attn_kwargs:
            num_heads: 8
            talking_heads: true
            edge_gate: false

      # class-attention pooling head with the DeParT block flavour (LayerScale + gated FFN)
      pool_net:
        class_path: salt.models.ClassAttentionPooling
        init_args:
          input_size: *out_dim
          num_layers: 2
          ls_init: 1.0e-5
          dense_kwargs:
            activation: *activation
            gated: true
          attn_kwargs:
            num_heads: 8

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: salt.models.ClassificationTask
              init_args:
                name: jets_classification
                input_name: jets
                label: flavour_label
                use_class_dict: True
                loss:
                  class_path: torch.nn.CrossEntropyLoss
                dense_config:
                  input_size: *out_dim
                  output_size: 6
                  hidden_layers: [128, 64, 32]
                  activation: *activation

            - class_path: salt.models.ClassificationTask
              init_args:
                name: track_origin
                input_name: tracks
                label: ftagTruthOriginLabel
                use_class_dict: True
                weight: 0.5
                loss:
                  class_path: torch.nn.CrossEntropyLoss
                dense_config:
                  input_size: *out_dim
                  context_size: *out_dim
                  output_size: 8
                  hidden_layers: [128, 64, 32]
                  activation: *activation

            - class_path: salt.models.VertexingTask
              init_args:
                name: track_vertexing
                input_name: tracks
                label: ftagTruthVertexIndex
                weight: 1.5
                loss:
                  class_path: torch.nn.BCEWithLogitsLoss
                  init_args:
                    reduction: none
                dense_config:
                  input_size: 256  # 2 * out_dim (pair of track embeddings)
                  context_size: *out_dim
                  hidden_layers: [128, 64, 32]
                  output_size: 1
                  activation: *activation

data:
  input_map:
    jets: jets
    tracks: tracks_ghost
  selections: null
  non_finite_to_num: True
  variables:
    jets:
      - pt_btagJes
      - eta_btagJes
    tracks:
      - pt  # needed for the kt/z edge features
      - d0
      - z0SinTheta
      - dphi
      - deta
      - qOverP
      - lifetimeSignedD0Significance
      - lifetimeSignedZ0SinThetaSignificance
      - phiUncertainty
      - thetaUncertainty
      - qOverPUncertainty
      - numberOfPixelHits
      - numberOfSCTHits
      - numberOfInnermostPixelLayerHits
      - numberOfNextToInnermostPixelLayerHits
      - numberOfInnermostPixelLayerSharedHits
      - numberOfInnermostPixelLayerSplitHits
      - numberOfPixelSharedHits
      - numberOfPixelSplitHits
      - numberOfSCTSharedHits
      - leptonID
      - muon_quality
      - muon_qOverPratio
      - muon_momentumBalanceSignificance
      - muon_scatteringNeighbourSignificance
  edge_constructors:
    - input_name: tracks
      edge_features:
        - dR
        - kt
        - z
        - isSelfLoop
  train_file: /global/cfs/cdirs/atlas/jmw464/gn3_data/pp_output_train.h5
  val_file: /global/cfs/cdirs/atlas/jmw464/gn3_data/pp_output_val.h5
  norm_dict: /global/cfs/cdirs/atlas/jmw464/gn3_data/GN3V01-Training-Samples/norm_dict.yaml
  class_dict: /global/cfs/cdirs/atlas/jmw464/gn3_data/GN3V01-Training-Samples/class_dict.yaml
  batch_size: 1000
  num_workers: 20

trainer:
  max_epochs: 40
  accelerator: gpu
  devices: 4
  num_nodes: 4
  precision: bf16-mixed
